[build]
  # Two explicit, sequential steps rather than `convex deploy --cmd '...'` —
  # that flag's exact ordering wasn't reliably generating convex/_generated
  # before the wrapped command ran on Netlify. `convex deploy` (using
  # CONVEX_DEPLOY_KEY, set as a Netlify env var) pushes convex/ to the
  # production deployment and writes convex/_generated/* as part of that;
  # only once that's done and confirmed on disk does `npm run build` run.
  #
  # Only the production context runs the real `convex deploy` — our
  # CONVEX_DEPLOY_KEY is a production key, and Convex's CLI refuses to use a
  # production key from a non-production build context (Deploy Previews,
  # branch deploys) as a safety check. Those contexts instead run
  # `convex codegen`, which regenerates convex/_generated locally from
  # convex/*.ts without deploying anything, so the build still typechecks
  # against the (already-deployed) prod schema/functions.
  #
  # Each company (src/config/tenants.ts) has its own Convex project, so the
  # production build deploys convex/ to all of them — see
  # scripts/convex-deploy-all.sh.
  command = "if [ \"$CONTEXT\" = \"production\" ]; then bash scripts/convex-deploy-all.sh && npm run build; else npx convex codegen && npm run build; fi"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Before the split into companies the app lived at the root; old links
# (shared posts, bookmarks, e-mail links) belonged to Apotheke.
[[redirects]]
  from = "/post/*"
  to = "/apotheke/post/:splat"
  status = 301

[[redirects]]
  from = "/calendar"
  to = "/apotheke/calendar"
  status = 301

[[redirects]]
  from = "/dashboard"
  to = "/apotheke/dashboard"
  status = 301

[[redirects]]
  from = "/matrix"
  to = "/apotheke/matrix"
  status = 301

[[redirects]]
  from = "/plan"
  to = "/apotheke/plan"
  status = 301

[[redirects]]
  from = "/campaigns"
  to = "/apotheke/campaigns"
  status = 301

[[redirects]]
  from = "/settings"
  to = "/apotheke/settings"
  status = 301

[[redirects]]
  from = "/login"
  to = "/apotheke/login"
  status = 301

# SPA routing - socka.site/<company>/... all served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
