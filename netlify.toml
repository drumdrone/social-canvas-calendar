[build]
  # `convex deploy` pushes convex/ to the production deployment (using
  # CONVEX_DEPLOY_KEY, set as a Netlify env var) and generates
  # convex/_generated/* before handing off to the Vite build — without this,
  # `vite build` fails immediately on the missing generated imports.
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
